plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.elcorderito.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'mx.elcorderito.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0-beta'
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
