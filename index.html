<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>El Corderito · Acceso beta</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f8f6f1;color:#202321}*{box-sizing:border-box}body{margin:0}header{background:#fffdf9;padding:20px 16px;border-bottom:1px solid #e7e0d8;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:36px}.name{color:#a91023;font:bold 27px Georgia,serif}.sub{font-size:9px;letter-spacing:2.1px}.dot{display:inline-block;height:12px;width:12px;border-radius:50%;background:#df4444;box-shadow:0 0 0 4px #f9e9e9}.dot.ok{background:#23b56c;box-shadow:0 0 0 4px #e1f7e9}main{max-width:760px;margin:0 auto;padding:17px 14px 84px}.panel{background:white;border:1px solid #eee5dc;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #402e1c08}h1{font-size:23px;margin:0 0 7px}h2{font-size:17px;margin:0 0 14px}p{margin:6px 0 13px;color:#6a6865;line-height:1.45;font-size:13px}.fine{font-size:12px;color:#7a7975}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f9f9f6;border:1px solid #efede8;border-radius:14px;padding:14px}.stat b{font-size:23px}.stat small{font-size:11px;color:#666;display:block;margin-top:5px}button{font:inherit;cursor:pointer;border-radius:11px;border:1px solid #d4c9c0;padding:10px 13px;background:white;color:#4c3b31}button.primary{color:white;background:#ad1225;border-color:#ad1225;font-weight:700}button:disabled{opacity:.45;cursor:wait}input,select{width:100%;padding:12px;border:1px solid #d7d0c8;border-radius:9px;font:inherit;background:white;color:#242524}label{font-size:12px;font-weight:650;display:block;margin:12px 0 5px}.error{background:#fff0f1;border:1px solid #ffcacb;border-radius:12px;padding:12px;color:#a51d28;white-space:pre-wrap;font-size:13px}.okmsg{background:#eaf8ee;border:1px solid #c8ebd0;border-radius:12px;padding:12px;color:#126936;font-size:13px}.nav{position:sticky;bottom:0;background:#fff;display:flex;justify-content:space-around;gap:4px;padding:10px;border-top:1px solid #e6e1db}.nav button{font-size:12px;flex:1;padding:9px 2px;border:0}.nav button.chosen{background:#b31225;color:#fff}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item b{font-size:14px}.item small{display:block;color:#7b7b7b;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:35px;padding:8px 0;background:#fbf0f1;color:#b31225;border:0}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#e5f7eb;color:#128145}.warn{background:#fff2d5;color:#936300}.total{font-size:25px;color:#16774a;font-weight:800}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.tabs .selected{background:#aa1224;color:white}.hidden{display:none}footer{padding:12px;text-align:center;font-size:11px;color:#9b9a95}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="brand"><span class="logo">🐑</span><div><div class="name">El Corderito</div><div class="sub">TORTAS · PARRILLA · BUEN SABOR</div></div></div><span id="light" class="dot" title="Estado de conexión"></span></header>
<main><section id="alerts"></section><section id="app"></section></main><div id="bottom"></div><footer>Versión 0.5 beta · Hospedada en GitHub Pages · No usar para cobros reales.</footer>
<script>
'use strict';
const PROJECT='https://xqdzpdbdvevqspshgxzk.supabase.co';
const KEY='sb_publishable_HU3SjxJ2yeM8kQun1zFRIg_iQj7gxDi';
const S={session:null,staff:null,products:[],ingredients:[],sales:[],priceHistory:[],cart:{},payment:'cash',page:'inicio',userEmail:'',recovery:false,online:false,busy:false,error:'',message:'',pending:null};
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
function light(ok){S.online=ok;$('light').classList.toggle('ok',ok)}
function note(msg,err=false){S.message=err?'':msg;S.error=err?msg:'';render()}
function loadSession(){try{S.session=JSON.parse(sessionStorage.getItem('corderito_session'))}catch(e){S.session=null}}
function storeSession(s){S.session=s;if(s)sessionStorage.setItem('corderito_session',JSON.stringify(s));else sessionStorage.removeItem('corderito_session')}
async function api(path,init={},retry=true){
 const headers={'apikey':KEY,'Content-Type':'application/json',...init.headers};if(S.session?.access_token)headers.Authorization='Bearer '+S.session.access_token;
 let res;try{res=await fetch(PROJECT+path,{...init,headers,cache:'no-store'})}catch(e){light(false);throw Error('No se puede conectar al servidor');}
 if(res.status===401&&retry&&S.session?.refresh_token&&!path.includes('/auth/v1/token')){await refreshToken();return api(path,init,false)}
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}
 if(!res.ok){light(false);throw Error(data?.msg||data?.message||data?.error_description||data?.error||'Error HTTP '+res.status)}light(true);return data;
}
async function refreshToken(){const r=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.session.refresh_token})},false);storeSession(r)}
async function setUser(){if(!S.session?.access_token)return;const u=await api('/auth/v1/user');const rows=await api('/rest/v1/staff?select=user_id,role,display_name,active&user_id=eq.'+enc(u.id)+'&active=eq.true');if(!Array.isArray(rows)||!rows.length)throw Error('Cuenta sin permiso para entrar a El Corderito.');S.staff=rows[0];S.userEmail=u.email||'';S.page=S.staff.role==='admin'?'inicio':'ventas';await sync();}
async function sync(){if(!S.staff)return;const promises=[api('/rest/v1/products?select=id,name,category,price,active&order=name.asc'),api('/rest/v1/ingredients?select=id,name,unit,stock,min_stock&order=name.asc'),api('/rest/v1/sales?select=id,total,created_at,payment_method,staff_id&order=created_at.desc&limit=100')];if(S.staff.role==='admin')promises.push(api('/rest/v1/price_history?select=id,product_id,old_price,new_price,changed_at&order=changed_at.desc&limit=30'));const r=await Promise.all(promises);[S.products,S.ingredients,S.sales]=r;S.priceHistory=r[3]||[];}
function loginView(){return '<div class="panel"><h1>Iniciar sesión</h1><p>Accede con la cuenta autorizada de administrador o empleado.</p><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" placeholder="correo@ejemplo.com"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><p></p><button class="primary" data-action="login">Entrar</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h2>Acceso por correo</h2><p>Si todavía no has establecido una contraseña, solicita un enlace para entrar. La dirección de GitHub Pages debe estar incluida en las URL de redirección permitidas en Supabase.</p><button data-action="magic">Enviar enlace de acceso</button><p class="fine">El código solo funciona si la plantilla de correo está configurada para enviar códigos OTP.</p><label>Código de correo (si lo recibes)</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Código de 6 dígitos"><p></p><button data-action="verify">Verificar código</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><button data-action="recover">Olvidé mi contraseña</button><p class="fine">Si ya tenías una contraseña, puedes solicitar un correo para restablecerla.</p></div>'}
function nav(){const admin=S.staff?.role==='admin';const tabs=admin?[['inicio','Inicio'],['ventas','Ventas'],['inventario','Inventario'],['precios','Precios'],['cuenta','Cuenta']]:[['ventas','Cobrar'],['inventario','Inventario'],['cuenta','Cuenta']];$('bottom').innerHTML='<nav class="nav">'+tabs.map(t=>'<button data-action="page" data-page="'+t[0]+'" class="'+(S.page===t[0]?'chosen':'')+'">'+t[1]+'</button>').join('')+'</nav>'}
function summary(){const today=new Date().toDateString(),day=S.sales.filter(s=>new Date(s.created_at).toDateString()===today),low=S.ingredients.filter(i=>Number(i.min_stock)>0&&Number(i.stock)<=Number(i.min_stock));return '<div class="panel"><h1>Resumen de hoy</h1><p>Panel administrativo sincronizado</p><div class="grid"><div class="stat"><b>'+money(day.reduce((a,s)=>a+Number(s.total),0))+'</b><small>Ventas registradas*</small></div><div class="stat"><b>'+day.length+'</b><small>Órdenes*</small></div><div class="stat"><b>'+low.length+'</b><small>Insumos bajo mínimo</small></div><div class="stat"><b>'+money(day.filter(s=>s.payment_method==='cash').reduce((a,s)=>a+Number(s.total),0))+'</b><small>Ventas en efectivo*</small></div></div><p class="fine">*Calculado sobre las últimas 100 ventas. No equivale a un corte de caja.</p></div><div class="panel"><h2>Inventario en alerta</h2>'+(low.length?low.map(i=>'<div class="item row"><div><b>'+esc(i.name)+'</b><small>'+Number(i.stock)+' '+esc(i.unit)+' disponibles</small></div><span class="pill warn">Bajo stock</span></div>').join(''):'<p>Sin alertas de inventario.</p>')+'</div><div class="panel"><h2>Actividad reciente</h2>'+S.sales.slice(0,10).map(s=>'<div class="item row"><div><b>Venta · '+esc(new Date(s.created_at).toLocaleString('es-MX'))+'</b><small>'+esc(s.payment_method)+'</small></div><b>'+money(s.total)+'</b></div>').join('')+'</div>'}
function total(){return S.products.reduce((a,p)=>a+Number(S.cart[p.id]||0)*Number(p.price),0)}
function sale(){const items=S.products.filter(p=>p.active);return '<div class="panel"><h1>Nueva venta</h1><p>Precios consultados del servidor. El importe definitivo se calcula otra vez al confirmar.</p>'+items.map(p=>'<div class="item row"><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+' · '+money(p.price)+'</small></div><div class="qty"><button data-action="minus" data-id="'+p.id+'">−</button><b>'+Number(S.cart[p.id]||0)+'</b><button data-action="plus" data-id="'+p.id+'">+</button></div></div>').join('')+'</div><div class="panel"><h2>Pedido actual</h2><div class="row"><b>Total estimado</b><span class="total">'+money(total())+'</span></div><label>Método de pago</label><select id="payment"><option value="cash" '+(S.payment==='cash'?'selected':'')+'>Efectivo</option><option value="transfer" '+(S.payment==='transfer'?'selected':'')+'>Transferencia</option><option value="card" '+(S.payment==='card'?'selected':'')+'>Tarjeta</option></select><p></p><button class="primary" data-action="checkout" '+(S.busy||(!total()&&!S.pending)?'disabled':'')+'>'+ (S.pending?'Verificar cobro pendiente':'Registrar venta')+'</button><p class="fine">Bloqueado si un ingrediente o receta de consumo no está configurado. Modo beta: no usar con dinero real.</p></div>'}
function inventory(){return '<div class="panel"><h1>Inventario</h1><p>Existencias obtenidas desde la base de datos.</p>'+S.ingredients.map(i=>'<div class="item row"><div><b>'+esc(i.name)+'</b><small>'+Number(i.stock)+' '+esc(i.unit)+' · mínimo '+Number(i.min_stock)+'</small></div>'+(Number(i.stock)<=Number(i.min_stock)?'<span class="pill warn">Bajo</span>':'<span class="pill">OK</span>')+'</div>').join('')+'</div>'+(S.staff.role==='admin'?'<div class="panel"><h2>Movimiento de inventario</h2><label>Ingrediente</label><select id="ingredient">'+S.ingredients.map(i=>'<option value="'+i.id+'">'+esc(i.name)+'</option>').join('')+'</select><label>Cantidad (negativa para merma)</label><input id="delta" type="number" step="any" inputmode="decimal" placeholder="Ej. 5 o -0.5"><label>Motivo</label><input id="reason" maxlength="200" placeholder="Compra o merma registrada"><p></p><button class="primary" data-action="adjust">Guardar movimiento</button></div>':'')}
function prices(){return '<div class="panel"><h1>Editar precios</h1><p>Solo administración. Cada cambio queda registrado y no modifica ventas antiguas.</p>'+S.products.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="row"><input id="price-'+p.id+'" type="number" step=".01" min="0.01" value="'+Number(p.price)+'" style="max-width:130px"><label style="margin:0"><input id="active-'+p.id+'" style="width:auto" type="checkbox" '+(p.active?'checked':'')+'> Activo</label><button data-action="price" data-id="'+p.id+'">Guardar</button></div></div>').join('')+'</div><div class="panel"><h2>Historial de precios</h2>'+S.priceHistory.map(h=>'<div class="item"><b>'+esc(S.products.find(p=>p.id===h.product_id)?.name||'Producto')+'</b><small>'+money(h.old_price)+' → '+money(h.new_price)+' · '+esc(new Date(h.changed_at).toLocaleString('es-MX'))+'</small></div>').join('')+'</div>'}
function accountView(){return '<div class="panel"><h1>Mi cuenta</h1><p>Iniciaste sesión como <b>'+esc(S.userEmail||'Cuenta autorizada')+'</b>.</p><h2>'+ (S.recovery?'Restablecer contraseña':'Crear o cambiar contraseña') +'</h2><p>Elige una contraseña exclusiva para El Corderito. Podrás volver a iniciar sesión con tu correo y esta contraseña.</p><label>Nueva contraseña</label><input id="newpass" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Mínimo 12 caracteres"><label>Confirma la nueva contraseña</label><input id="newpass2" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Repite tu contraseña"><p></p><button class="primary" data-action="save-password">Guardar contraseña</button><p class="fine">No compartas tu contraseña. También puedes seguir usando el enlace por correo.</p></div>'}\nfunction render(){const app=$('app');const a=$('alerts');a.innerHTML=(S.error?'<div class="error">'+esc(S.error)+'</div>':'')+(S.message?'<div class="okmsg">'+esc(S.message)+'</div>':'');if(!S.staff){app.innerHTML=loginView();$('bottom').innerHTML='';return}app.innerHTML='<div class="panel row"><div><b>'+esc(S.staff.display_name)+'</b><small style="display:block">'+(S.staff.role==='admin'?'Administrador':'Empleado')+'</small></div><div class="row"><button data-action="sync">Actualizar</button><button data-action="logout">Salir</button></div></div>'+(S.page==='inicio'?summary():S.page==='ventas'?sale():S.page==='inventario'?inventory():S.page==='precios'?prices():accountView());nav()}
async function checkout(){let job=S.pending;if(!job){const items=Object.entries(S.cart).filter(([id,qty])=>qty>0).map(([product_id,qty])=>({product_id,qty}));if(!items.length)throw Error('Primero agrega productos');job={request:crypto.randomUUID(),items,payment:S.payment,user:S.staff.user_id};S.pending=job;sessionStorage.setItem('corderito_pending',JSON.stringify(job))}if(job.user!==S.staff.user_id)throw Error('Cobro pendiente de otra cuenta');const result=await api('/rest/v1/rpc/pos_checkout',{method:'POST',body:JSON.stringify({p_request:job.request,p_items:job.items,p_payment:job.payment})});S.pending=null;sessionStorage.removeItem('corderito_pending');S.cart={};await sync();note('Venta confirmada: '+money(result.total)+(result.duplicated?' (reintento seguro)':''));}
async function click(e){const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;e.preventDefault();if(S.busy)return;S.error='';S.message='';const email=String($('email')?.value||'').trim(),password=$('password')?.value||'';try{S.busy=true;
 if(action==='login'){if(!email||!password)throw Error('Escribe correo y contraseña');const auth=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});storeSession(auth);await setUser()}
 else if(action==='magic'){if(!email)throw Error('Escribe primero tu correo');await api('/auth/v1/otp?redirect_to='+enc(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email,create_user:false})});note('Se solicitó el enlace. Si regresa a una dirección anterior, configura el nuevo enlace de GitHub Pages como Redirect URL en Supabase.');return}
 else if(action==='verify'){const token=$('otp')?.value||'';if(!email||!token)throw Error('Escribe el correo y el código');const auth=await api('/auth/v1/verify',{method:'POST',body:JSON.stringify({email,token,type:'email'})});storeSession(auth);await setUser()}
 else if(action==='save-password'){const pw=$('newpass')?.value||'',confirm=$('newpass2')?.value||'';if(pw.length<12||pw.length>128)throw Error('Usa una contraseña de 12 a 128 caracteres');if(pw!==confirm)throw Error('Las contraseñas no coinciden');if(!S.session?.access_token)throw Error('Vuelve a iniciar sesión antes de guardar la contraseña');await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})});S.recovery=false;S.message='Contraseña guardada correctamente. En el siguiente inicio podrás usar tu correo y contraseña.';}\n else if(action==='recover'){if(!email)throw Error('Escribe primero tu correo electrónico');await api('/auth/v1/recover?redirect_to='+enc(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});S.message='Si el correo tiene una cuenta, recibirás un enlace para restablecer la contraseña.';return}\n else if(action==='logout'){storeSession(null);S.staff=null;S.cart={};S.pending=null;sessionStorage.removeItem('corderito_pending');light(false)}
 else if(action==='page'){S.page=btn.dataset.page}
 else if(action==='plus'||action==='minus'){const id=btn.dataset.id;S.cart[id]=Math.max(0,Number(S.cart[id]||0)+(action==='plus'?1:-1));}
 else if(action==='sync'){await sync();S.message='Datos sincronizados'}
 else if(action==='checkout'){S.payment=$('payment')?.value||S.payment;await checkout();return}
 else if(action==='price'){const id=btn.dataset.id,price=Number($('price-'+id).value),active=$('active-'+id).checked;if(!Number.isFinite(price)||price<=0)throw Error('Precio no válido');await api('/rest/v1/rpc/admin_update_price',{method:'POST',body:JSON.stringify({p_product:id,p_price:price,p_active:active})});await sync();S.message='Precio actualizado'}
 else if(action==='adjust'){const ingredient=$('ingredient')?.value,delta=Number($('delta')?.value),reason=$('reason')?.value||'';if(!ingredient||!delta)throw Error('Movimiento inválido');await api('/rest/v1/rpc/admin_adjust_inventory',{method:'POST',body:JSON.stringify({p_ingredient:ingredient,p_delta:delta,p_reason:reason})});await sync();S.message='Inventario actualizado'}
 }catch(err){S.error=err.message||String(err)}finally{S.busy=false;render()}}
document.addEventListener('click',click);
(async()=>{const fragment=new URLSearchParams(location.hash.slice(1));S.recovery=fragment.get('type')==='recovery';if(fragment.get('access_token')){storeSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});history.replaceState(null,'',location.pathname);}loadSession();try{S.pending=JSON.parse(sessionStorage.getItem('corderito_pending'))}catch(e){}if(S.session){try{await setUser();if(S.recovery){S.page='cuenta';S.message='Establece una contraseña nueva para recuperar el acceso a tu cuenta.'}}catch(err){S.error=err.message;storeSession(null);S.staff=null}}render();setInterval(async()=>{if(S.staff&&!S.busy){try{await sync();render()}catch(e){S.error='Problema de sincronización: '+e.message;render()}}},12000)})();
</script></body></html>
