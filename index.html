const S={session:null,staff:null,products:[],ingredients:[],sales:[],promotions:[],promotionHistory:[],historyMonth:null,historyDay:null,monthStats:null,dayDetails:null,priceHistory:[],recipes:[],recipeParts:[],productParts:[],recipeDraft:null,consumptionDraft:null,consumptionProduct:null,editIngredient:null,batches:[],batchPending:null,cart:{},payment:'cash',selectedCategory:'Todos',daily:null,team:[],shifts:[],cashMovements:[],openShift:null,shiftSummary:null,pendingCashMovement:null,lastSyncAt:null,page:'inicio',userEmail:'',loginPrefill:'',remember:true,recentAccounts:[],recovery:false,online:false,busy:false,error:'',message:'',pending:null};

const SESSION_KEY='corderito_session',KNOWN_KEY='corderito_recent_accounts_v1',KEEP_KEY='corderito_keep_signed_in_v1';
let refreshInFlight=null;
function readKnown(){
 try{const data=JSON.parse(localStorage.getItem(KNOWN_KEY)||'[]');return Array.isArray(data)?data.filter(x=>typeof x==='string').slice(0,5):[];}catch(e){return [];}
}
function rememberEmail(email){
 const e=String(email||'').toLowerCase().trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return;
 S.recentAccounts=[e,...readKnown().filter(x=>x!==e)].slice(0,5);
 localStorage.setItem(KNOWN_KEY,JSON.stringify(S.recentAccounts));
}
function forgetEmail(email){
 S.recentAccounts=readKnown().filter(x=>x!==email);
 localStorage.setItem(KNOWN_KEY,JSON.stringify(S.recentAccounts));
 if(S.loginPrefill===email)S.loginPrefill='';
}
function loadSession(){
 try{
  S.remember=localStorage.getItem(KEEP_KEY)!=='0';
  S.recentAccounts=readKnown();
  S.session=JSON.parse(localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY)||'null');
  if(S.session&&S.remember&&!localStorage.getItem(SESSION_KEY)){
   localStorage.setItem(SESSION_KEY,JSON.stringify(S.session));
   sessionStorage.removeItem(SESSION_KEY);
  }
 }catch(e){S.session=null;}
}
function storeSession(s){
 S.session=s||null;
 if(s){
  if(!s.access_token||!s.refresh_token)throw Error('La sesión no contiene credenciales completas');
  if(S.remember){localStorage.setItem(SESSION_KEY,JSON.stringify(s));sessionStorage.removeItem(SESSION_KEY);}
  else{sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));localStorage.removeItem(SESSION_KEY);}
 }else{localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY);}
}
function saveRememberSetting(value){
 S.remember=!!value;
 localStorage.setItem(KEEP_KEY,S.remember?'1':'0');
 if(S.session)storeSession(S.session);
}
function resetAccount(){
 storeSession(null);
 for(const k of ['corderito_pending','corderito_batch_pending','corderito_cash_move_pending'])
  sessionStorage.removeItem(k);
 S.staff=null;S.userEmail='';S.products=[];S.ingredients=[];S.sales=[];S.priceHistory=[];
 S.recipes=[];S.recipeParts=[];S.productParts=[];S.recipeDraft=null;
 S.consumptionDraft=null;S.consumptionProduct=null;S.editIngredient=null;
 S.batches=[];S.batchPending=null;S.pending=null;S.cart={};S.payment='cash';
 S.daily=null;S.team=[];S.shifts=[];S.cashMovements=[];S.openShift=null;S.shiftSummary=null;
 S.pendingCashMovement=null;S.lastSyncAt=null;S.page='inicio';S.recovery=false;S.promotions=[];S.promotionHistory=[];S.monthStats=null;S.dayDetails=null;S.historyMonth=null;S.historyDay=null;light(false);
}
async function leaveAccount(){
 if(S.pending||S.batchPending||S.pendingCashMovement)
  throw Error('Hay una venta, lote o movimiento de efectivo pendiente; revísalo antes de cambiar o cerrar la sesión.');
 try{
  if(S.session?.access_token)
   await api('/auth/v1/logout?scope=local',{method:'POST',body:'{}'},false);
 }catch(e){
  // Local session cleared even when offline. This does not guarantee remote revocation.

async function api(path,init={},retry=true){
 const headers={'apikey':KEY,'Content-Type':'application/json',...init.headers};
 if(S.session?.access_token)headers.Authorization='Bearer '+S.session.access_token;
 let res;try{res=await fetch(PROJECT+path,{...init,headers,cache:'no-store'});}
 catch(e){light(false);throw Error('No se puede conectar al servidor');}
 if(res.status===401&&retry&&S.session?.refresh_token&&!path.includes('/auth/v1/token')){
  await refreshToken();return api(path,init,false);
 }
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}
 if(!res.ok){
  light(false);
  const error=new Error(data?.msg||data?.message||data?.error_description||data?.error||'Error HTTP '+res.status);
  if(res.status===401)error.authExpired=true;
  throw error;
 }
 return data;
}
async function refreshToken(){
 if(refreshInFlight)return refreshInFlight;
 if(!S.session?.refresh_token)throw Error('No existe una sesión renovable');
 const current=S.session.refresh_token;
 refreshInFlight=(async()=>{
  let r;try{
   r=await fetch(PROJECT+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',cache:'no-store',headers:{'apikey':KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:current})});
  }catch(e){throw Error('Sin conexión para renovar la sesión');}
  const payload=await r.json().catch(()=>null);
  if(!r.ok||!payload?.access_token||!payload?.refresh_token){
   const err=new Error('Tu sesión caducó. Entra nuevamente con tu contraseña.');
   if([400,401,403].includes(r.status))err.authExpired=true;
   throw err;
  }
  if(S.session?.refresh_token===current)storeSession(payload);
 })();
 try{return await refreshInFlight}finally{refreshInFlight=null}
}

function bestLinePrice(product,quantity){
 const q=Math.max(0,Math.floor(Number(quantity)||0)),unit=Number(product.price);
 if(!product.active||q===0)return {total:0,base:0,discount:0,bundles:[]};
 const promo=S.promotions.filter(p=>p.product_id===product.id&&p.active);
 const two=promo.find(p=>Number(p.bundle_qty)===2),three=promo.find(p=>Number(p.bundle_qty)===3);
 let best=unit*q,b2=0,b3=0;
 for(let n3=0;n3<=Math.floor(q/3);n3++){
  if(n3&&!three)continue;
  for(let n2=0;n2<=Math.floor((q-3*n3)/2);n2++){
   if(n2&&!two)continue;
   const singles=q-3*n3-2*n2,price=singles*unit+n2*Number(two?.bundle_price||0)+n3*Number(three?.bundle_price||0);
   if(price<best){best=price;b2=n2;b3=n3;}
  }
 }
 return {total:Math.round(best*100)/100,base:unit*q,discount:Math.round((unit*q-best)*100)/100,
  bundles:[...(b2?[{bundle_qty:2,bundles:b2}]:[]),...(b3?[{bundle_qty:3,bundles:b3}]:[])]};
}

 if(!open){
 dashboard+='<div class="panel"><div class="section-head"><h2>Abrir mi turno</h2><span class="mini-tag">Sin turno activo</span></div>'+
 '<label>Dinero inicial para cambio (MXN)</label><input id="shift-opening" inputmode="decimal" type="number" step=".01" min="0" value="0">'+
 '<p class="fine">Indica el dinero que ya tienes en la caja antes de empezar a vender.</p>'+
 '<button class="primary checkout-btn" data-action="shift-open">Abrir turno de caja</button></div>';
 } else {
 dashboard+='<div class="hero"><span class="eyebrow">TURNO EN CURSO</span><p style="margin-top:12px">Efectivo esperado en caja</p>'+
 '<h1>'+(summary?money(summary.expected_cash):'—')+'</h1>'+
 '<p>Turno iniciado el '+esc(localTime(open.opened_at))+'</p></div>'+
 '<div class="dashboard-metrics"><div class="metric"><span class="metric-icon">'+ico('receipt')+'</span><b>'+(summary?Number(summary.orders):'—')+'</b><small>Pedidos en el turno</small></div>'+
 '<div class="metric"><span class="metric-icon green">'+ico('cash')+'</span><b>'+(summary?money(summary.cash_sales):'—')+'</b><small>Ventas en efectivo</small></div>'+
 '<div class="metric"><span class="metric-icon warn">'+ico('cart')+'</span><b>'+(summary?money(summary.noncash_sales):'—')+'</b><small>Tarjeta + transferencias</small></div></div>'+
 '<div class="panel"><h2>Desglose del turno</h2>'+
 cashRow('Fondo inicial',open.opening_cash)+cashRow('Ventas en efectivo',summary?.cash_sales)+
 cashRow('Entradas de efectivo',summary?.cash_in)+cashRow('Salidas de efectivo',summary?.cash_out)+
 '<div class="row" style="margin-top:10px"><b>Efectivo esperado</b><strong>'+money(summary?.expected_cash||0)+'</strong></div></div>'+
 '<div class="panel"><h2>Entradas y retiros de dinero</h2><p>Registra dinero adicional para cambio o retiros realizados durante el turno.</p>'+
 '<label>Tipo de movimiento</label><select id="cash-kind"><option value="in">Entrada de efectivo</option><option value="out">Retiro de efectivo</option></select>'+
 '<label>Importe (MXN)</label><input id="cash-amount" type="number" step=".01" min=".01" inputmode="decimal" placeholder="0.00">'+
 '<label>Motivo</label><input id="cash-reason" maxlength="250" placeholder="Ej. Más cambio o retiro autorizado">'+
 '<p></p>'+(S.pendingCashMovement?'<div class="caution">Hay un movimiento pendiente de confirmación. Reinténtalo para comprobarlo sin duplicarlo.</div><button data-action="cash-retry">Verificar movimiento pendiente</button>':'<button data-action="cash-move">Registrar movimiento</button>')+
 (S.cashMovements.filter(x=>x.shift_id===open.id).slice(0,8).map(x=>'<div class="activity-line"><div class="activity-main"><b>'+
 (x.kind==='in'?'Entrada':'Salida')+'</b><small>'+esc(x.reason)+' · '+esc(localTime(x.created_at))+'</small></div>'+
 '<strong>'+(x.kind==='out'?'−':'+')+money(x.amount)+'</strong></div>').join(''))+'</div>'+
 '<div class="panel"><h2>Cerrar y cuadrar caja</h2><p>Cuenta físicamente todo el efectivo del cajón. El sistema calculará si sobra o falta dinero.</p>'+
 '<label>Efectivo contado (MXN)</label><input id="shift-counted" type="number" min="0" step=".01" inputmode="decimal" placeholder="Ej. 1320.50">'+
 '<label>Observaciones del cierre</label><textarea id="shift-notes" rows="2" maxlength="1000" placeholder="Ej. Faltaron monedas para cambio"></textarea>'+
 '<p></p><button class="primary checkout-btn" data-action="shift-close">Confirmar corte y cerrar turno</button></div>';
 }
 dashboard+='<div class="panel"><div class="section-head"><h2>Historial de turnos</h2><span class="mini-tag">'+history.length+' recientes</span></div>'+
 (history.length?history.map(x=>'<div class="activity-line"><div class="activity-glyph">'+ico('cash')+'</div>'+
 '<div class="activity-main"><b>'+esc(shiftLabel(x))+'</b><small>'+esc(localTime(x.opened_at))+' · '+(x.closed_at?'Cerrado':'Abierto')+'</small>'+
 (x.closed_at?'<small>Esperado '+money(x.expected_cash)+' · contado '+money(x.counted_cash)+'</small>':'')+'</div>'+

function promotionView(){
 const products=S.products.filter(p=>p.active);

 '<button data-action="offer-save" data-id="'+p.id+'" data-qty="'+q+'">Guardar '+q+'×</button></div>';
 }).join('')+'</div>').join('')+
 '<div class="panel"><h2>Historial de cambios</h2>'+
 (S.promotionHistory.length?S.promotionHistory.slice(0,20).map(x=>'<div class="item"><b>'+esc(S.products.find(p=>p.id===x.product_id)?.name||'Producto')+' · '+x.bundle_qty+'×</b>'+

function historyView(){
 const ym=S.historyMonth||localDateKey().slice(0,7),[year,month]=ym.split('-').map(Number),
 calendar=S.monthStats?.days||[],detail=S.dayDetails;
 const title=new Date(Date.UTC(year,month-1,15)).toLocaleDateString('es-MX',{month:'long',year:'numeric',timeZone:'UTC'});
 const blank=(new Date(Date.UTC(year,month-1,1)).getUTCDay()+6)%7;
 const sum=calendar.reduce((n,d)=>n+Number(d.total),0);
 return '<div class="panel"><h1>Calendario de ventas</h1><p>Consulta cualquier día del mes. Los datos se agrupan según la hora de Tabasco.</p>'+
 '<div class="row calendar-nav"><button data-action="history-prev">‹</button><b>'+esc(title)+'</b><button data-action="history-next">›</button></div>'+
 '<div class="row" style="margin:15px 0"><b>Ventas del mes</b><strong>'+money(sum)+'</strong></div>'+
 '<div class="calendar-grid">'+['L','M','M','J','V','S','D'].map(n=>'<span class="calendar-weekday">'+n+'</span>').join('')+
 Array.from({length:blank},()=>'<span></span>').join('')+calendar.map(day=>{
 const date=String(day.date).slice(0,10);
 return '<button data-action="history-day" data-day="'+esc(date)+'" class="calendar-day '+(date===S.historyDay?'selected':'')+'">'+
 '<b>'+Number(date.slice(-2))+'</b><small>'+(Number(day.orders)?money(day.total):'—')+'</small></button>';
 }).join('')+'</div></div>'+
 (detail?'<div class="panel"><h2>Detalle del '+esc(detail.date)+'</h2>'+
 '<div class="dashboard-metrics"><div class="metric"><b>'+money(detail.total)+'</b><small>Ventas</small></div>'+
 '<div class="metric"><b>'+detail.orders+'</b><small>Pedidos</small></div>'+
 '<div class="metric"><b>'+money(detail.discounts)+'</b><small>Descuentos</small></div></div>'+
 '<p>Efectivo '+money(detail.cash)+' · Tarjeta '+money(detail.card)+' · Transferencia '+money(detail.transfer)+'</p>'+
 '<h2>Ventas por empleado</h2>'+(detail.staff?.length?detail.staff.map(t=>'<div class="row item"><b>'+esc(t.display_name)+'</b><small>'+t.orders+' pedidos · '+money(t.total)+'</small></div>').join(''):'<p>No hubo ventas.</p>')+
 '<h2>Turnos abiertos ese día</h2>'+(detail.shifts_opened?.length?detail.shifts_opened.map(t=>'<div class="item"><b>'+esc(t.staff)+'</b><small>'+esc(localTime(t.opened_at))+' · '+(t.closed_at?'Cerrado':'Abierto')+'</small>'+
 '<small>'+Number(t.orders||0)+' pedidos · '+money(t.sales_total||0)+' vendidos en el turno</small>'+
 '<small>Efectivo '+money(t.cash_sales||0)+' · Transferencia '+money(t.transfer_sales||0)+' · Tarjeta '+money(t.card_sales||0)+'</small>'+
 '<small>Entradas '+money(t.cash_in||0)+' · Retiros '+money(t.cash_out||0)+'</small>'+
 (t.closed_at?'<small>Esperado '+money(t.expected_cash)+' · contado '+money(t.counted_cash)+' · diferencia '+money(t.difference)+'</small>':'')+
 (t.notes?'<small>'+esc(t.notes)+'</small>':'')+'</div>').join(''):'<p>Ningún turno comenzó ese día.</p>')+
 '<h2>Comprobantes</h2>'+(detail.receipts?.length?detail.receipts.map(t=>'<div class="history-receipt"><div class="row"><b>'+esc(t.staff)+'</b><strong>'+money(t.total)+'</strong></div>'+
 '<small>'+esc(localTime(t.created_at))+' · '+esc(displayPayment(t.payment_method))+'</small>'+
 (t.items||[]).map(i=>'<div class="row item"><span>'+i.quantity+'× '+esc(i.name)+'</span><b>'+money(i.line_total)+'</b></div>'+
 (Number(i.discount_total)>0?'<small>Descuento: '+money(i.discount_total)+'</small>':'')).join('')+'</div>').join(''):'<p>Sin comprobantes.</p>')+
 (detail.receipts_truncated?'<div class="caution">Se muestran los 100 comprobantes más recientes; los totales abarcan todas las ventas.</div>':'')+'</div>':'');
}

function getRecipeDraft(id){
 const r=S.recipes.find(x=>x.id===id);
 if(!r)throw Error('Receta no encontrada');
 return {id:r.id,name:r.name,category:r.category,yield_quantity:String(r.yield_quantity),yield_unit:r.yield_unit,instructions:r.instructions,notes:r.notes,
 lines:S.recipeParts.filter(x=>x.recipe_id===id).map(x=>({ingredient_id:x.ingredient_id,quantity:String(x.quantity)}))};
}
function normalizedLines(lines){
 const v=lines.map(x=>({ingredient_id:x.ingredient_id,quantity:Number(x.quantity)}));
 if(v.some(x=>!S.ingredients.some(i=>i.id===x.ingredient_id)||!Number.isFinite(x.quantity)||x.quantity<=0))throw Error('Elige un ingrediente y una cantidad positiva en cada línea.');
 if(new Set(v.map(x=>x.ingredient_id)).size!==v.length)throw Error('El mismo ingrediente aparece dos veces.');
 return v;
}

   await api('/rest/v1/rpc/admin_save_consumption',{method:'POST',
    body:JSON.stringify({p_product:S.consumptionProduct,p_lines:lines})});
   S.consumptionDraft=null;S.consumptionProduct=null;await sync();S.message='Consumo por venta guardado';
  }
 }

 
 else if(action==='batch-link'){
  if(S.staff?.role!=='admin')throw Error('Solo administrador');
  const recipe=S.recipes.find(r=>r.id===btn.dataset.id);
  const value=$('output-'+btn.dataset.id)?.value||null;
  if(!recipe)throw Error('No se encontró la receta');
  if(value===recipe.prepared_ingredient_id)throw Error('El resultado seleccionado ya está vinculado');
  if(!confirm(value?'¿Vincular esta receta a ese producto preparado?':'¿Quitar el producto preparado de esta receta?'))return;
  await api('/rest/v1/rpc/admin_set_recipe_output',{method:'POST',
   body:JSON.stringify({p_recipe:recipe.id,p_ingredient:value})});
  await sync();S.message='Producto preparado vinculado a la receta';
 }
 else if(action==='batch-save'||action==='batch-retry'){
  if(S.staff?.role!=='admin')throw Error('Solo administrador');
  if(!S.batchPending){
   if(action==='batch-retry')throw Error('No hay lote pendiente');
   const recipe=$('batch-recipe')?.value;
   const scale=Number($('batch-scale')?.value),actual=Number($('batch-actual')?.value);
   const notes=$('batch-notes')?.value.trim()||'';
   if(!S.recipes.some(x=>x.id===recipe&&x.prepared_ingredient_id))throw Error('Selecciona una receta con un resultado preparado vinculado.');
   if(!Number.isFinite(scale)||scale<=0||scale>1000||
      !Number.isFinite(actual)||actual<=0||actual>100000||
      Math.round(scale*1000)!==scale*1000||Math.round(actual*1000)!==actual*1000)
     throw Error('Indica cantidades válidas con máximo tres decimales.');
   if(!confirm('¿Confirmar el lote? Se descontará materia prima y se agregará producto preparado al inventario.'))return;
   S.batchPending={request:crypto.randomUUID(),recipe,scale,actual,notes,user:S.staff.user_id};
   sessionStorage.setItem('corderito_batch_pending',JSON.stringify(S.batchPending));
  }
  const job=S.batchPending;
  if(job.user!==S.staff.user_id)throw Error('Hay un lote pendiente registrado con otra cuenta. Usa su cuenta original.');
  const result=await api('/rest/v1/rpc/admin_register_preparation_batch',{method:'POST',
   body:JSON.stringify({p_request:job.request,p_recipe:job.recipe,p_scale:job.scale,p_actual:job.actual,p_notes:job.notes})});
  S.batchPending=null;
  sessionStorage.removeItem('corderito_batch_pending');
  await sync();
  S.message='Lote registrado. Rendimiento real: '+Number(result.actual_yield)+'. '+
      (result.duplicate?'Reintento comprobado: no hubo un segundo descuento.':'Inventario actualizado.');
 }

 else if(action==='price'){const id=btn.dataset.id,price=Number($('price-'+id).value),active=$('active-'+id).checked;if(!Number.isFinite(price)||price<=0)throw Error('Precio no válido');await api('/rest/v1/rpc/admin_update_price',{method:'POST',body:JSON.stringify({p_product:id,p_price:price,p_active:active})});await sync();S.message='Precio actualizado'}
 else if(action==='adjust'){const ingredient=$('ingredient')?.value,delta=Number($('delta')?.value),reason=$('reason')?.value||'';if(!ingredient||!delta)throw Error('Movimiento inválido');await api('/rest/v1/rpc/admin_adjust_inventory',{method:'POST',body:JSON.stringify({p_ingredient:ingredient,p_delta:delta,p_reason:reason})});await sync();S.message='Inventario actualizado'}
 }catch(err){S.error=err.message||String(err)}finally{S.busy=false;render()}}
document.addEventListener('click',click);

(async()=>{
 loadSession();
 const fragment=new URLSearchParams(location.hash.slice(1));
 S.recovery=fragment.get('type')==='recovery';
 if(fragment.get('access_token')&&fragment.get('refresh_token')){
  storeSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
  history.replaceState(null,'',location.pathname);
 }
 try{S.pending=JSON.parse(sessionStorage.getItem('corderito_pending'))}catch(e){}
 try{S.batchPending=JSON.parse(sessionStorage.getItem('corderito_batch_pending'))}catch(e){}
 try{S.pendingCashMovement=JSON.parse(sessionStorage.getItem('corderito_cash_move_pending'))}catch(e){}
 if(S.session){
  try{
   await setUser();
   if(S.recovery){S.page='cuenta';S.message='Establece una contraseña nueva para recuperar el acceso.';}
  }catch(err){
   S.error=err.message||String(err);
   if(err.authExpired){resetAccount();S.error='La sesión ha caducado; vuelve a entrar.';}
  }
 }
 render();
 setInterval(async()=>{
  if(S.staff&&!S.busy){
   try{await sync();
    if(!S.recipeDraft&&S.consumptionDraft===null&&S.editIngredient===null&&
       !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render();
   }catch(e){S.error='Problema de sincronización: '+e.message;render();}
  }
 },12000);
})();
</script></body></html>
