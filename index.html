bottom:0;background:#fff;display:flex;justify-content:space-around;gap:4px;padding:10px;border-top:1px solid #e6e1db}.nav button{font-size:12px;flex:1;padding:9px 2px;border:0}.nav button.chosen{background:#b31225;color:#fff}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item b{font-size:14px}.item small{display:block;color:#7b7b7b;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:35px;padding:8px 0;background:#fbf0f1;color:#b31225;border:0}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#e5f7eb;color:#128145}.warn{background:#fff2d5;color:#936300}.total{font-size:25px;color:#16774a;font-weight:800}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.tabs .selected{background:#aa1224;color:white}.hidden{display:none}footer{padding:12px;text-align:center;font-size:11px;color:#9b9a95}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}

<script>
'use strict';
const PROJECT='https://xqdzpdbdvevqspshgxzk.supabase.co';
const KEY='sb_publishable_HU3SjxJ2yeM8kQun1zFRIg_iQj7gxDi';
const S={session:null,staff:null,products:[],ingredients:[],sales:[],priceHistory:[],recipes:[],recipeParts:[],productParts:[],recipeDraft:null,consumptionDraft:null,consumptionProduct:null,editIngredient:null,batches:[],batchPending:null,cart:{},payment:'cash',page:'inicio',userEmail:'',recovery:false,online:false,busy:false,error:'',message:'',pending:null};
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;

function light(ok){S.online=ok;$('light').classList.toggle('ok',ok)}
function note(msg,err=false){S.message=err?'':msg;S.error=err?msg:'';render()}
function loadSession(){try{S.session=JSON.parse(sessionStorage.getItem('corderito_session'))}catch(e){S.session=null}}
function storeSession(s){S.session=s;if(s)sessionStorage.setItem('corderito_session',JSON.stringify(s));else sessionStorage.removeItem('corderito_session')}
async function api(path,init={},retry=true){
 const headers={'apikey':KEY,'Content-Type':'application/json',...init.headers};if(S.session?.access_token)headers.Authorization='Bearer '+S.session.access_token;
 let res;try{res=await fetch(PROJECT+path,{...init,headers,cache:'no-store'})}catch(e){light(false);throw Error('No se puede conectar al servidor');}
 if(res.status===401&&retry&&S.session?.refresh_token&&!path.includes('/auth/v1/token')){await refreshToken();return api(path,init,false)}
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}
 if(!res.ok){light(false);throw Error(data?.msg||data?.message||data?.error_description||data?.error||'Error HTTP '+res.status)}light(true);return data;
}
async function refreshToken(){const r=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.session.refresh_token})},false);storeSession(r)}
async function setUser(){if(!S.session?.access_token)return;const u=await api('/auth/v1/user');const rows=await api('/rest/v1/staff?select=user_id,role,display_name,active&user_id=eq.'+enc(u.id)+'&active=eq.true');if(!Array.isArray(rows)||!rows.length)throw Error('Cuenta sin permiso para entrar a El Corderito.');S.staff=rows[0];S.userEmail=u.email||'';S.page=S.staff.role==='admin'?'inicio':'ventas';await sync();}
async function sync(){if(!S.staff)return;const promises=[api('/rest/v1/products?select=id,name,category,price,active&order=name.asc'),api('/rest/v1/ingredients?select=id,name,unit,stock,min_stock&order=name.asc'),api('/rest/v1/sales?select=id,total,created_at,payment_method,staff_id&order=created_at.desc&limit=100')];if(S.staff.role==='admin')promises.push(api('/rest/v1/price_history?select=id,product_id,old_price,new_price,changed_at&order=changed_at.desc&limit=30'),api('/rest/v1/recipes?select=id,name,category,yield_quantity,yield_unit,instructions,notes,prepared_ingredient_id&order=name.asc'),api('/rest/v1/recipe_ingredients?select=recipe_id,ingredient_id,quantity'),api('/rest/v1/product_ingredients?select=product_id,ingredient_id,quantity'),api('/rest/v1/preparation_batches?select=id,recipe_id,recipe_name_snapshot,prepared_ingredient_id,scale_factor,planned_yield,actual_yield,notes,created_at&order=created_at.desc&limit=30'));const r=await Promise.all(promises);[S.products,S.ingredients,S.sales]=r;S.priceHistory=r[3]||[];S.recipes=r[4]||[];S.recipeParts=r[5]||[];S.productParts=r[6]||[];S.batches=r[7]||[];}
function loginView(){return '<div class="panel"><h1>Iniciar sesión</h1><p>Accede con la cuenta autorizada de administrador o empleado.</p><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" placeholder="correo@ejemplo.com"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><p></p><button class="primary" data-action="login">Entrar</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h2>Acceso por correo</h2><p>Si todavía no has establecido una contraseña, solicita un enlace para entrar. La dirección de GitHub Pages debe estar incluida en las URL de redirección permitidas en Supabase.</p><button data-action="magic">Enviar enlace de acceso</button><p class="fine">El código solo funciona si la plantilla de correo está configurada para enviar códigos OTP.</p><label>Código de correo (si lo recibes)</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Código de 6 dígitos"><p></p><button data-action="verify">Verificar código</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><button data-action="recover">Olvidé mi contraseña</button><p class="fine">Si ya tenías una contraseña, puedes solicitar un correo para restablecerla.</p></div>'}
function nav(){const admin=S.staff?.role==='admin';const tabs=admin?[['inicio','Inicio'],['ventas','Ventas'],['inventario','Inventario'],['mas','Más']]:[['ventas','Cobrar'],['inventario','Inventario'],['cuenta','Cuenta']];$('bottom').innerHTML='<nav class="nav">'+tabs.map(t=>'<button data-action="page" data-page="'+t[0]+'" class="'+(S.page===t[0]?'chosen':'')+'">'+t[1]+'</button>').join('')+'</nav>'}
function summary(){const today=new Date().toDateString(),day=S.sales.filter(s=>new Date(s.created_at).toDateString()===today),low=S.ingredients.filter(i=>Number(i.min_stock)>0&&Number(i.stock)<=Number(i.min_stock));return '<div class="panel"><h1>Resumen de hoy</h1><p>Panel administrativo sincronizado</p><div class="grid"><div class="stat"><b>'+money(day.reduce((a,s)=>a+Number(s.total),0))+'</b><small>Ventas registradas*</small></div><div class="stat"><b>'+day.length+'</b><small>Órdenes*</small></div><div class="stat"><b>'+low.length+'</b><small>Insumos bajo mínimo</small></div><div class="stat"><b>'+money(day.filter(s=>s.payment_method==='cash').reduce((a,s)=>a+Number(s.total),0))+'</b><small>Ventas en efectivo*</small></div></div><p class="fine">*Calculado sobre las últimas 100 ventas. No equivale a un corte de caja.</p></div><div class="panel"><h2>Inventario en alerta</h2>'+(low.length?low.map(i=>'<div class="item row"><div><b>'+esc(i.name)+'</b><small>'+Number(i.stock)+' '+esc(i.unit)+' disponibles</small></div><span class="pill warn">Bajo stock</span></div>').join(''):'<p>Sin alertas de inventario.</p>')+'</div><div class="panel"><h2>Actividad reciente</h2>'+S.sales.slice(0,10).map(s=>'<div class="item row"><div><b>Venta · '+esc(new Date(s.created_at).toLocaleString('es-MX'))+'</b><small>'+esc(s.payment_method)+'</small></div><b>'+money(s.total)+'</b></div>').join('')+'</div>'}
function total(){return S.products.reduce((a,p)=>a+Number(S.cart[p.id]||0)*Number(p.price),0)}
function sale(){const items=S.products.filter(p=>p.active);return '<div class="panel"><h1>Nueva venta</h1><p>Precios consultados del servidor. El importe definitivo se calcula otra vez al confirmar.</p>'+items.map(p=>'<div class="item row"><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+' · '+money(p.price)+'</small></div><div class="qty"><button data-action="minus" data-id="'+p.id+'">−</button><b>'+Number(S.cart[p.id]||0)+'</b><button data-action="plus" data-id="'+p.id+'">+</button></div></div>').join('')+'</div><div class="panel"><h2>Pedido actual</h2><div class="row"><b>Total estimado</b><span class="total">'+money(total())+'</span></div><label>Método de pago</label><select id="payment"><option value="cash" '+(S.payment==='cash'?'selected':'')+'>Efectivo</option><option value="transfer" '+(S.payment==='transfer'?'selected':'')+'>Transferencia</option><option value="card" '+(S.payment==='card'?'selected':'')+'>Tarjeta</option></select><p></p><button class="primary" data-action="checkout" '+(S.busy||(!total()&&!S.pending)?'disabled':'')+'>'+ (S.pending?'Verificar cobro pendiente':'Registrar venta')+'</button><p class="fine">Bloqueado si un ingrediente o receta de consumo no está configurado. Modo beta: no usar con dinero real.</p></div>'}
function inventory(){return '<div class="panel"><h1>Inventario</h1><p>Existencias obtenidas desde la base de datos.</p>'+S.ingredients.map(i=>'<div class="item row"><div><b>'+esc(i.name)+'</b><small>'+Number(i.stock)+' '+esc(i.unit)+' · mínimo '+Number(i.min_stock)+'</small></div>'+(Number(i.stock)<=Number(i.min_stock)?'<span class="pill warn">Bajo</span>':'<span class="pill">OK</span>')+'</div>').join('')+'</div>'+(S.staff.role==='admin'?'<div class="panel"><h2>Movimiento de inventario</h2><label>Ingrediente</label><select id="ingredient">'+S.ingredients.map(i=>'<option value="'+i.id+'">'+esc(i.name)+'</option>').join('')+'</select><label>Cantidad (negativa para merma)</label><input id="delta" type="number" step="any" inputmode="decimal" placeholder="Ej. 5 o -0.5"><label>Motivo</label><input id="reason" maxlength="200" placeholder="Compra o merma registrada"><p></p><button class="primary" data-action="adjust">Guardar movimiento</button></div>':'')}
function prices(){return '<div class="panel"><h1>Editar precios</h1><p>Solo administración. Cada cambio queda registrado y no modifica ventas antiguas.</p>'+S.products.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="row"><input id="price-'+p.id+'" type="number" step=".01" min="0.01" value="'+Number(p.price)+'" style="max-width:130px"><label style="margin:0"><input id="active-'+p.id+'" style="width:auto" type="checkbox" '+(p.active?'checked':'')+'> Activo</label><button data-action="price" data-id="'+p.id+'">Guardar</button></div></div>').join('')+'</div><div class="panel"><h2>Historial de precios</h2>'+S.priceHistory.map(h=>'<div class="item"><b>'+esc(S.products.find(p=>p.id===h.product_id)?.name||'Producto')+'</b><small>'+money(h.old_price)+' → '+money(h.new_price)+' · '+esc(new Date(h.changed_at).toLocaleString('es-MX'))+'</small></div>').join('')+'</div>'}
function accountView(){return '<div class="panel"><h1>Mi cuenta</h1><p>Iniciaste sesión como <b>'+esc(S.userEmail||'Cuenta autorizada')+'</b>.</p><h2>'+ (S.recovery?'Restablecer contraseña':'Crear o cambiar contraseña') +'</h2><p>Elige una contraseña exclusiva para El Corderito. Podrás volver a iniciar sesión con tu correo y esta contraseña.</p><label>Nueva contraseña</label><input id="newpass" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Mínimo 12 caracteres"><label>Confirma la nueva contraseña</label><input id="newpass2" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Repite tu contraseña"><p></p><button class="primary" data-action="save-password">Guardar contraseña</button><p class="fine">No compartas tu contraseña. También puedes seguir usando el enlace por correo.</p></div>'}

function adminMore(){
 return '<div class="panel"><h1>Administración</h1><p>Configuración privada para el propietario.</p>'+
 [['ingredientes','Ingredientes y suministros','Crear ingredientes, unidades y niveles mínimos.'],['recetas','Recetario privado','Porciones, componentes y pasos de cocina.'],['lotes','Lotes preparados','Transforma materia prima en producto listo.'],['consumo','Consumo por venta','Define cuánto se descuenta al vender.'],['precios','Precios','Ajustes e historial.'],['cuenta','Cuenta','Contraseña y seguridad.']].map(t=>
 '<div class="item row"><div><b>'+esc(t[1])+'</b><small>'+esc(t[2])+'</small></div><button data-action="page" data-page="'+t[0]+'">Abrir ›</button></div>'

}

 const x=S.ingredients.find(i=>i.id===S.editIngredient),edit=!!x;
 const current=x||{name:'',unit:'g',min_stock:0};
 return '<div class="panel"><h2>'+(edit?'Editar ingrediente':'Añadir ingrediente')+'</h2><label>Nombre</label><input id="ing-name" maxlength="100" value="'+esc(current.name)+'" placeholder="Ej. Pierna de cerdo cruda">'+
 '<div class="form-grid"><div><label>Unidad</label><select id="ing-unit" '+(edit?'disabled':'')+'>'+
 ['g','kg','ml','L','pz'].map(u=>'<option value="'+u+'" '+(current.unit===u?'selected':'')+'>'+u+'</option>').join('')+
 '</select></div><div><label>Avisar si quedan</label><input id="ing-min" type="number" min="0" step="any" value="'+esc(current.min_stock)+'"></div></div>'+

function ingredientsView(){
 return '<div class="panel"><h1>Ingredientes individuales</h1><p>Solo administración. Registra materias primas y preparaciones con unidades consistentes.</p><button class="primary" data-action="ingredient-new">+ Agregar ingrediente</button></div>'+

 '<div class="panel"><h2>Lista de ingredientes ('+S.ingredients.length+')</h2>'+
 (S.ingredients.length?S.ingredients.map(i=>'<div class="item row"><div><b>'+esc(i.name)+'</b><small>'+Number(i.stock)+' '+esc(i.unit)+' · alerta '+Number(i.min_stock)+' '+esc(i.unit)+'</small></div><button data-action="ingredient-edit" data-id="'+i.id+'">Editar</button></div>').join(''):'<p>Aún no hay ingredientes. Empieza registrando la materia prima.</p>')+'</div>';

 return '<select data-'+kind+'-line="'+index+'" data-part="ingredient_id"><option value="">Selecciona ingrediente</option>'+
 S.ingredients.map(i=>'<option value="'+i.id+'" '+(i.id===value?'selected':'')+'>'+esc(i.name)+' ('+esc(i.unit)+')</option>').join('')+'</select>';

 return '<div class="panel"><h2>'+(d.id?'Editar receta':'Nueva receta')+'</h2>'+
 '<label>Nombre de la preparación</label><input data-rfield="name" maxlength="100" value="'+esc(d.name)+'" placeholder="Ej. Pierna guisada">'+
 '<label>Categoría</label><input data-rfield="category" maxlength="60" value="'+esc(d.category)+'">'+

 return '<div class="panel"><h1>Consumo por venta</h1><p>Configura qué ingredientes se descuentan automáticamente con cada producto vendido.</p></div>'+
 (S.consumptionDraft!==null?consumptionDraftView():'')+
 '<div class="panel"><h2>Productos ('+S.products.length+')</h2>'+
 S.products.map(p=>'<div class="item row"><div><b>'+esc(p.name)+'</b><small>'+S.productParts.filter(x=>x.product_id===p.id).length+' ingredientes configurados</small></div><button data-action="consumption-edit" data-id="'+p.id+'">Configurar</button></div>').join('')+'</div>';
}

function recipeOutputOptions(r,chosen){
 return '<option value="">Seleccionar producto preparado</option>'+
 S.ingredients.filter(i=>i.unit===r.yield_unit).map(i=>
 '<option value="'+i.id+'" '+(i.id===chosen?'selected':'')+'>'+esc(i.name)+' ('+esc(i.unit)+')</option>'
 ).join('');
}
function batchesView(){
 const configured=S.recipes.filter(r=>r.prepared_ingredient_id&&S.recipeParts.some(x=>x.recipe_id===r.id));
 return '<div class="panel"><h1>Lotes preparados</h1><p>Registra una preparación: se descuentan los ingredientes crudos y se suma al inventario la cantidad real obtenida.</p>'+
 '<p class="fine">Primero registra ingredientes y sus existencias, prepara una receta y vincúlala con un ingrediente de salida. Los datos deben estar en unidades compatibles.</p></div>'+
 '<div class="panel"><h2>1. Vincular recetas con su producto terminado</h2>'+
 (S.recipes.length?S.recipes.map(r=>{
 const matches=S.ingredients.filter(i=>i.unit===r.yield_unit);
 return '<div class="item"><b>'+esc(r.name)+'</b><small>Rendimiento de la receta: '+Number(r.yield_quantity)+' '+esc(r.yield_unit)+
 '. Si no hay opciones, cambia la unidad de rendimiento de la receta a kg, g, L, ml o pz.</small>'+
 '<label>Ingrediente que obtienes al terminar</label>'+
 '<div class="row"><select id="output-'+r.id+'" style="min-width:0;flex:1">'+recipeOutputOptions(r,r.prepared_ingredient_id)+'</select>'+
 '<button data-action="batch-link" data-id="'+r.id+'">Vincular</button></div>'+
 '<small>'+ (matches.length?'':'Primero crea el ingrediente terminado con la misma unidad.')+'</small></div>';
 }).join(''):'<p>Crea al menos una receta en el Recetario privado.</p>')+'</div>'+
 '<div class="panel"><h2>2. Registrar lote elaborado</h2>'+
 (S.batchPending?'<div class="error">Hay una operación de lote sin confirmación. Para evitar duplicados, reintenta el mismo registro antes de crear otro.<p><button data-action="batch-retry">Reintentar este lote</button></p></div>':
  '<label>Receta</label><select id="batch-recipe"><option value="">Seleccionar receta</option>'+
  configured.map(r=>'<option value="'+r.id+'">'+esc(r.name)+' ('+Number(r.yield_quantity)+' '+esc(r.yield_unit)+' por tanda)</option>').join('')+
  '</select><label>Número de tandas (multiplicador)</label><input type="number" min=".001" step=".001" value="1" id="batch-scale">'+
  '<label>Cantidad REAL obtenida (unidad indicada en la receta)</label><input type="number" min=".001" step=".001" placeholder="Ej. 1.5" id="batch-actual">'+
  '<label>Observaciones</label><textarea id="batch-notes" rows="3" maxlength="1000" placeholder="Ej. Se cocinaron 2 kg de pierna y quedaron 1.6 kg preparados"></textarea>'+
  '<p class="fine">Cantidad usada: ingredientes de la receta × número de tandas. El rendimiento real puede ser diferente al esperado.</p>'+
  '<button class="primary" data-action="batch-save" '+(configured.length?'':'disabled')+'>Registrar lote y actualizar existencias</button>')+
 '</div><div class="panel"><h2>3. Historial de preparaciones</h2>'+
 (S.batches.length?S.batches.map(b=>'<div class="item"><b>'+esc(b.recipe_name_snapshot)+'</b>'+
 '<small>'+new Date(b.created_at).toLocaleString('es-MX')+' · '+Number(b.scale_factor)+' tanda(s)</small>'+
 '<small>Esperado: '+Number(b.planned_yield)+' · obtenido: '+Number(b.actual_yield)+' '+
 esc(S.ingredients.find(i=>i.id===b.prepared_ingredient_id)?.unit||'')+'</small>'+
 (b.notes?'<small>'+esc(b.notes)+'</small>':'')+'</div>').join(''):'<p>No se han registrado lotes todavía.</p>')+'</div>';
}

function emptyRecipe(){
 return {id:null,name:'',category:'Preparación',yield_quantity:'1',yield_unit:'porciones',instructions:'',notes:'',lines:[]};
}
function getRecipeDraft(id){
 const r=S.recipes.find(x=>x.id===id);
 if(!r)throw Error('Receta no encontrada');
 return {id:r.id,name:r.name,category:r.category,yield_quantity:String(r.yield_quantity),yield_unit:r.yield_unit,instructions:r.instructions,notes:r.notes,
 lines:S.recipeParts.filter(x=>x.recipe_id===id).map(x=>({ingredient_id:x.ingredient_id,quantity:String(x.quantity)}))};
}
function normalizedLines(lines){
 const v=lines.map(x=>({ingredient_id:x.ingredient_id,quantity:Number(x.quantity)}));
 if(v.some(x=>!S.ingredients.some(i=>i.id===x.ingredient_id)||!Number.isFinite(x.quantity)||x.quantity<=0))throw Error('Elige un ingrediente y una cantidad positiva en cada línea.');
 if(new Set(v.map(x=>x.ingredient_id)).size!==v.length)throw Error('El mismo ingrediente aparece dos veces.');
 return v;
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(S.staff?.role!=='admin')return;
 if(S.recipeDraft&&t.dataset.rfield){S.recipeDraft[t.dataset.rfield]=t.value;}
 if(S.recipeDraft&&t.dataset.rLine!==undefined){const line=S.recipeDraft.lines[Number(t.dataset.rLine)];if(line)line[t.dataset.part]=t.value;}
 if(S.consumptionDraft!==null&&t.dataset.cLine!==undefined){const line=S.consumptionDraft[Number(t.dataset.cLine)];if(line)line[t.dataset.part]=t.value;}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(S.staff?.role!=='admin')return;
 if(S.recipeDraft&&t.dataset.rLine!==undefined){const line=S.recipeDraft.lines[Number(t.dataset.rLine)];if(line)line[t.dataset.part]=t.value;}
 if(S.consumptionDraft!==null&&t.dataset.cLine!==undefined){const line=S.consumptionDraft[Number(t.dataset.cLine)];if(line)line[t.dataset.part]=t.value;}
});

function render(){const app=$('app');const a=$('alerts');a.innerHTML=(S.error?'<div class="error">'+esc(S.error)+'</div>':'')+(S.message?'<div class="okmsg">'+esc(S.message)+'</div>':'');if(!S.staff){app.innerHTML=loginView();$('bottom').innerHTML='';return}app.innerHTML='<div class="panel row"><div><b>'+esc(S.staff.display_name)+'</b><small style="display:block">'+(S.staff.role==='admin'?'Administrador':'Empleado')+'</small></div><div class="row"><button data-action="sync">Actualizar</button><button data-action="logout">Salir</button></div></div>'+(S.page==='inicio'?summary():S.page==='ventas'?sale():S.page==='inventario'?inventory():S.page==='precios'?prices():S.page==='mas'?adminMore():S.page==='ingredientes'?ingredientsView():S.page==='recetas'?recipesView():S.page==='lotes'?batchesView():S.page==='consumo'?consumptionView():accountView());nav()}
async function checkout(){let job=S.pending;if(!job){const items=Object.entries(S.cart).filter(([id,qty])=>qty>0).map(([product_id,qty])=>({product_id,qty}));if(!items.length)throw Error('Primero agrega productos');job={request:crypto.randomUUID(),items,payment:S.payment,user:S.staff.user_id};S.pending=job;sessionStorage.setItem('corderito_pending',JSON.stringify(job))}if(job.user!==S.staff.user_id)throw Error('Cobro pendiente de otra cuenta');const result=await api('/rest/v1/rpc/pos_checkout',{method:'POST',body:JSON.stringify({p_request:job.request,p_items:job.items,p_payment:job.payment})});S.pending=null;sessionStorage.removeItem('corderito_pending');S.cart={};await sync();note('Venta confirmada: '+money(result.total)+(result.duplicated?' (reintento seguro)':''));}
async function click(e){const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;e.preventDefault();if(S.busy)return;S.error='';S.message='';const email=String($('email')?.value||'').trim(),password=$('password')?.value||'';try{S.busy=true;
 if(action==='login'){if(!email||!password)throw Error('Escribe correo y contraseña');const auth=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});storeSession(auth);await setUser()}
 else if(action==='magic'){if(!email)throw Error('Escribe primero tu correo');await api('/auth/v1/otp?redirect_to='+enc(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email,create_user:false})});note('Se solicitó el enlace. Si regresa a una dirección anterior, configura el nuevo enlace de GitHub Pages como Redirect URL en Supabase.');return}
 else if(action==='verify'){const token=$('otp')?.value||'';if(!email||!token)throw Error('Escribe el correo y el código');const auth=await api('/auth/v1/verify',{method:'POST',body:JSON.stringify({email,token,type:'email'})});storeSession(auth);await setUser()}
 else if(action==='save-password'){const pw=$('newpass')?.value||'',confirm=$('newpass2')?.value||'';if(pw.length<12||pw.length>128)throw Error('Usa una contraseña de 12 a 128 caracteres');if(pw!==confirm)throw Error('Las contraseñas no coinciden');if(!S.session?.access_token)throw Error('Vuelve a iniciar sesión antes de guardar la contraseña');await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})});S.recovery=false;S.message='Contraseña guardada correctamente. En el siguiente inicio podrás usar tu correo y contraseña.';}
 else if(action==='recover'){if(!email)throw Error('Escribe primero tu correo electrónico');await api('/auth/v1/recover?redirect_to='+enc(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});S.message='Si el correo tiene una cuenta, recibirás un enlace para restablecer la contraseña.';return}
 else if(action==='logout'){storeSession(null);S.staff=null;S.cart={};S.pending=null;sessionStorage.removeItem('corderito_pending');light(false)}
 else if(action==='page'){S.page=btn.dataset.page}
 else if(action==='plus'||action==='minus'){const id=btn.dataset.id;S.cart[id]=Math.max(0,Number(S.cart[id]||0)+(action==='plus'?1:-1));}
 else if(action==='sync'){await sync();S.message='Datos sincronizados'}
 else if(action==='checkout'){S.payment=$('payment')?.value||S.payment;await checkout();return}
 
 else if(['ingredient-new','ingredient-edit','ingredient-cancel','ingredient-save',
          'recipe-new','recipe-edit','recipe-add-line','recipe-remove-line','recipe-cancel','recipe-save',
          'consumption-edit','consumption-add-line','consumption-remove-line','consumption-cancel','consumption-save'].includes(action)){
  if(S.staff?.role!=='admin')throw Error('Esta función es exclusiva del administrador.');
  if(action==='ingredient-new')S.editIngredient='new';
  else if(action==='ingredient-edit')S.editIngredient=btn.dataset.id;
  else if(action==='ingredient-cancel')S.editIngredient=null;
  else if(action==='ingredient-save'){
   const id=S.editIngredient==='new'?null:S.editIngredient;
   const existing=S.ingredients.find(i=>i.id===id);
   const name=$('ing-name').value.trim(),unit=existing?.unit||$('ing-unit').value,min=Number($('ing-min').value);
   if(name.length<2||!Number.isFinite(min)||min<0)throw Error('Nombre o stock mínimo inválidos');
   await api('/rest/v1/rpc/admin_upsert_ingredient',{method:'POST',body:JSON.stringify({p_id:id,p_name:name,p_unit:unit,p_min:min})});
   S.editIngredient=null;await sync();S.message='Ingrediente guardado';
  }
  else if(action==='recipe-new'){S.recipeDraft=emptyRecipe();}
  else if(action==='recipe-edit'){S.recipeDraft=getRecipeDraft(btn.dataset.id);}
  else if(action==='recipe-add-line'){S.recipeDraft.lines.push({ingredient_id:'',quantity:''});}
  else if(action==='recipe-remove-line'){S.recipeDraft.lines.splice(Number(btn.dataset.index),1);}
  else if(action==='recipe-cancel'){S.recipeDraft=null;}
  else if(action==='recipe-save'){
   const d=S.recipeDraft,lines=normalizedLines(d.lines),yieldQty=Number(d.yield_quantity);
   if(d.name.trim().length<2||!Number.isFinite(yieldQty)||yieldQty<=0||!d.yield_unit.trim())throw Error('Nombre o rendimiento inválidos');
   await api('/rest/v1/rpc/admin_save_recipe',{method:'POST',body:JSON.stringify({
    p_id:d.id,p_name:d.name.trim(),p_category:d.category.trim(),p_yield:yieldQty,p_unit:d.yield_unit.trim(),
    p_instructions:d.instructions,p_notes:d.notes,p_lines:lines})});
   S.recipeDraft=null;await sync();S.message='Receta guardada de forma privada';
  }
  else if(action==='consumption-edit'){
   S.consumptionProduct=btn.dataset.id;
   S.consumptionDraft=S.productParts.filter(x=>x.product_id===S.consumptionProduct)
      .map(x=>({ingredient_id:x.ingredient_id,quantity:String(x.quantity)}));
  }
  else if(action==='consumption-add-line'){S.consumptionDraft.push({ingredient_id:'',quantity:''});}
  else if(action==='consumption-remove-line'){S.consumptionDraft.splice(Number(btn.dataset.index),1);}
  else if(action==='consumption-cancel'){S.consumptionDraft=null;S.consumptionProduct=null;}
  else if(action==='consumption-save'){
   const lines=normalizedLines(S.consumptionDraft);
   if(!confirm('¿Guardar el consumo para futuras ventas? No afectará ventas anteriores.'))return;
   await api('/rest/v1/rpc/admin_save_consumption',{method:'POST',
    body:JSON.stringify({p_product:S.consumptionProduct,p_lines:lines})});
   S.consumptionDraft=null;S.consumptionProduct=null;await sync();S.message='Consumo por venta guardado';
  }
 }

 
 else if(action==='batch-link'){
  if(S.staff?.role!=='admin')throw Error('Solo administrador');
  const recipe=S.recipes.find(r=>r.id===btn.dataset.id);
  const value=$('output-'+btn.dataset.id)?.value||null;
  if(!recipe)throw Error('No se encontró la receta');
  if(value===recipe.prepared_ingredient_id)throw Error('El resultado seleccionado ya está vinculado');
  if(!confirm(value?'¿Vincular esta receta a ese producto preparado?':'¿Quitar el producto preparado de esta receta?'))return;
  await api('/rest/v1/rpc/admin_set_recipe_output',{method:'POST',
   body:JSON.stringify({p_recipe:recipe.id,p_ingredient:value})});
  await sync();S.message='Producto preparado vinculado a la receta';
 }
 else if(action==='batch-save'||action==='batch-retry'){
  if(S.staff?.role!=='admin')throw Error('Solo administrador');
  if(!S.batchPending){
   if(action==='batch-retry')throw Error('No hay lote pendiente');
   const recipe=$('batch-recipe')?.value;
   const scale=Number($('batch-scale')?.value),actual=Number($('batch-actual')?.value);
   const notes=$('batch-notes')?.value.trim()||'';
   if(!S.recipes.some(x=>x.id===recipe&&x.prepared_ingredient_id))throw Error('Selecciona una receta con un resultado preparado vinculado.');
   if(!Number.isFinite(scale)||scale<=0||scale>1000||
      !Number.isFinite(actual)||actual<=0||actual>100000||
      Math.round(scale*1000)!==scale*1000||Math.round(actual*1000)!==actual*1000)
     throw Error('Indica cantidades válidas con máximo tres decimales.');
   if(!confirm('¿Confirmar el lote? Se descontará materia prima y se agregará producto preparado al inventario.'))return;
   S.batchPending={request:crypto.randomUUID(),recipe,scale,actual,notes,user:S.staff.user_id};
   sessionStorage.setItem('corderito_batch_pending',JSON.stringify(S.batchPending));
  }
  const job=S.batchPending;
  if(job.user!==S.staff.user_id)throw Error('Hay un lote pendiente registrado con otra cuenta. Usa su cuenta original.');
  const result=await api('/rest/v1/rpc/admin_register_preparation_batch',{method:'POST',
   body:JSON.stringify({p_request:job.request,p_recipe:job.recipe,p_scale:job.scale,p_actual:job.actual,p_notes:job.notes})});
  S.batchPending=null;
  sessionStorage.removeItem('corderito_batch_pending');
  await sync();
  S.message='Lote registrado. Rendimiento real: '+Number(result.actual_yield)+'. '+
      (result.duplicate?'Reintento comprobado: no hubo un segundo descuento.':'Inventario actualizado.');
 }

 else if(action==='price'){const id=btn.dataset.id,price=Number($('price-'+id).value),active=$('active-'+id).checked;if(!Number.isFinite(price)||price<=0)throw Error('Precio no válido');await api('/rest/v1/rpc/admin_update_price',{method:'POST',body:JSON.stringify({p_product:id,p_price:price,p_active:active})});await sync();S.message='Precio actualizado'}
 else if(action==='adjust'){const ingredient=$('ingredient')?.value,delta=Number($('delta')?.value),reason=$('reason')?.value||'';if(!ingredient||!delta)throw Error('Movimiento inválido');await api('/rest/v1/rpc/admin_adjust_inventory',{method:'POST',body:JSON.stringify({p_ingredient:ingredient,p_delta:delta,p_reason:reason})});await sync();S.message='Inventario actualizado'}
 }catch(err){S.error=err.message||String(err)}finally{S.busy=false;render()}}
document.addEventListener('click',click);
(async()=>{const fragment=new URLSearchParams(location.hash.slice(1));S.recovery=fragment.get('type')==='recovery';if(fragment.get('access_token')){storeSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});history.replaceState(null,'',location.pathname);}loadSession();try{S.pending=JSON.parse(sessionStorage.getItem('corderito_pending'))}catch(e){}try{S.batchPending=JSON.parse(sessionStorage.getItem('corderito_batch_pending'))}catch(e){}if(S.session){try{await setUser();if(S.recovery){S.page='cuenta';S.message='Establece una contraseña nueva para recuperar el acceso a tu cuenta.'}}catch(err){S.error=err.message;storeSession(null);S.staff=null}}render();setInterval(async()=>{if(S.staff&&!S.busy){try{await sync();if(!S.recipeDraft && S.consumptionDraft===null && S.editIngredient===null && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render()}catch(e){S.error='Problema de sincronización: '+e.message;render()}}},12000)})();
</script></body></html>
